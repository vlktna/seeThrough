name: Check and publish demo

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: seethrough-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Expo project configuration
        run: npm run check:config

  publish:
    name: Publish demo update
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Serialize publishes: never cancel a publish while it is talking to EAS.
    # GitHub replaces older pending runs; the HEAD check also skips stale commits.
    concurrency:
      group: seethrough-eas-demo
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Skip a superseded main commit
        id: current
        shell: bash
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$latest_sha" ]; then
            echo 'Unable to read the current main branch.' >&2
            exit 1
          fi
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Skipped: a newer commit is already on main.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check publishing credentials
        if: steps.current.outputs.publish == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'Add EXPO_TOKEN at https://github.com/vlktna/seeThrough/settings/secrets/actions to enable publishing.' >&2
            exit 1
          fi

      - name: Set up Node
        if: steps.current.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up EAS
        if: steps.current.outputs.publish == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: 25.1.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.current.outputs.publish == 'true'
        run: npm ci

      - name: Publish JavaScript and assets
        if: steps.current.outputs.publish == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: >-
          eas update
          --branch demo
          --environment preview
          --platform all
          --message "main ${GITHUB_SHA}"
          --non-interactive
          --json
          > eas-update.json

      - name: Save update details
        if: success() && steps.current.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eas-update-${{ github.sha }}
          path: eas-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        if: success() && steps.current.outputs.publish == 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Published JavaScript and assets to EAS Update branch **demo**, environment **preview**.

          [Open SeeThrough updates](https://expo.dev/accounts/vlktna/projects/seethrough/updates) and select this update for its preview link.

          Expo Go requires a compatible SDK and owner/owning-organization access. This does not create a standalone app or force an already running app to reload.

          The `eas-update.json` artifact contains the publish result.
          SUMMARY
